<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conciliación SRI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/tablero.css">
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <h1>Conciliación SRI</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" id="tab-compras" data-modo="compras" role="tab">Compras <small>recibidos</small></button>
      <button class="tab" id="tab-ventas" data-modo="ventas" role="tab">Ventas <small>emitidos</small></button>
    </nav>
    <div class="barra-acc">
      <button class="btn-sec" id="btn-nueva" title="Descarta los TXT y el resultado de esta pestaña">Nueva conciliación</button>
      <a href="/logout" class="salir" title="Cerrar sesión">Salir</a>
    </div>
  </div>
</header>

<main>
  <section class="carga">
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="input-txt" accept=".txt,text/plain" multiple hidden>
      <strong>Suelta aquí los TXT del portal SRI</strong>
      <span>o haz clic para seleccionarlos</span>
      <p class="hint" id="hint-compras">Comprobantes recibidos. Hasta 5 archivos: facturas, notas de crédito, notas de débito y retenciones; puedes subirlos juntos o cualquier subconjunto. Los datos de Odoo se leen automáticamente.</p>
      <p class="hint" id="hint-ventas" hidden>Comprobantes emitidos. Hasta 400 TXT de la semana (facturas, notas de crédito, notas de débito, liquidaciones y retenciones), con cualquier nombre. Odoo se lee automáticamente.</p>
    </label>
    <div class="archivos">
      <div class="archivos-cab"><h2>Archivos cargados</h2><span id="archivos-cuenta"></span></div>
      <ul id="lista-archivos" class="lista"></ul>
    </div>
  </section>

  <div id="avisos"></div>

  <section class="resultado">
    <div class="res-cab">
      <h2>Resultado</h2>
      <span id="periodo" class="periodo"></span>
      <span id="actualizando" class="actualizando" hidden><i class="spin"></i><span id="act-msg">Actualizando…</span></span>
    </div>
    <div id="advertencias"></div>
    <div id="tarjetas" class="tarjetas"></div>
  </section>

  <section class="excepciones" id="sec-excepciones">
    <div class="exc-cab">
      <h2>Excepciones</h2>
      <div class="descargas">
        <button id="btn-obs" class="btn-pri" disabled>Descargar observaciones (Excel)</button>
        <button id="btn-completo" class="btn-sec" disabled>Descargar Excel completo</button>
      </div>
    </div>
    <div class="filtros">
      <div id="chips-estado" class="chips"></div>
      <div class="filtros-der">
        <select id="f-tipo" aria-label="Filtrar por tipo"></select>
        <input type="search" id="f-buscar" placeholder="Buscar documento, contraparte o RUC" aria-label="Buscar">
        <label class="toggle"><input type="checkbox" id="f-info"> Informativos <span id="info-cuenta"></span></label>
      </div>
    </div>
    <div id="tabla" class="tabla-wrap"></div>
  </section>
</main>

<script src="/static/tablero.js"></script>
</body>
</html>
