<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Conciliación SRI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex;
           justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
            padding: 2rem; width: 100%; max-width: 360px; }
    h1 { color: #1F4E78; font-size: 1.3rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 0.4rem; font-weight: bold; }
    input[type=text], input[type=password] {
      width: 100%; border: 1px solid #ccc; border-radius: 4px;
      padding: 0.55rem 0.75rem; font-size: 0.95rem; outline: none;
      transition: border-color .15s;
    }
    input[type=text]:focus, input[type=password]:focus { border-color: #1F4E78; }
    button { width: 100%; padding: 0.75rem; background: #1F4E78; color: white;
             border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;
             margin-top: 0.5rem; transition: background .2s; }
    button:hover { background: #163d5f; }
    .login-error { color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem;
                   background: #fdecea; border-radius: 4px; padding: 0.5rem 0.75rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>Conciliación SRI</h1>
  <p class="subtitle">Inicia sesión para continuar.</p>

  <!-- LOGIN_ERROR -->

  <form method="post" action="/login">
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Ingresar</button>
  </form>
</div>

<script>
  // Mostrar error si viene ?error=1 en la URL
  if (new URLSearchParams(location.search).get("error")) {
    const el = document.createElement("p");
    el.className = "login-error";
    el.textContent = "Usuario o contraseña incorrectos.";
    document.querySelector("form").before(el);
  }
</script>
</body>
</html>
